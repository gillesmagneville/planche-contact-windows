# SPDX-License-Identifier: GPL-3.0-only
#
# Builds and tests planche-contact-windows.
#
#   rust   (Linux)    tests the engine, then cross-compiles it for Windows
#   app    (Windows)  tests the window's core library with that engine,
#                     builds the window and checks that it starts
#
# The context menu verb and the installer get their jobs when they arrive,
# as in explorer-convert-images.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-gnu

jobs:
  rust:
    name: Engine (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the MinGW-w64 compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

      # The version pinned in rust-toolchain.toml, with the Windows target.
      - name: Install the Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target "$WINDOWS_TARGET"
          rustup show active-toolchain
          cargo --version

      - name: Test
        run: cargo test --locked

      - name: Build for Windows
        run: cargo build --release --locked --target "$WINDOWS_TARGET"

      # It must run on a Windows that has no MinGW installed.
      - name: Check that the engine needs no MinGW DLL
        run: |
          if x86_64-w64-mingw32-objdump -p "target/$WINDOWS_TARGET/release/planche-contact-engine.exe" \
              | grep -i 'DLL Name' | grep -i -E 'libstdc\+\+|libgcc|libwinpthread'; then
            echo "::error::planche-contact-engine.exe depends on a MinGW DLL (see above)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: engine-windows
          path: target/${{ env.WINDOWS_TARGET }}/release/planche-contact-engine.exe
          if-no-files-found: error

  app:
    name: Window (C#, WinUI 3)
    needs: rust
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: engine-windows
          path: engine-windows

      # The same tests as on Linux, with the engine built for Windows.
      - name: Test the core library with the real engine
        shell: pwsh
        env:
          PLANCHE_CONTACT_REQUIRE_ENGINE: "1"
        run: |
          $env:PLANCHE_CONTACT_ENGINE = (Resolve-Path engine-windows\planche-contact-engine.exe).Path
          dotnet run -c Release --project app/PlancheContact.Core.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the window
        shell: pwsh
        run: |
          dotnet publish app/PlancheContact -c Release -r win-x64 -p:Platform=x64 -o dist/planche-contact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add the engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\planche-contact\engine | Out-Null
          Copy-Item engine-windows\planche-contact-engine.exe dist\planche-contact\engine\

      # The window must start and stay up (a missing resource file, for
      # example, makes it stop at once), with its engine found next to it.
      - name: Check that the window starts
        shell: pwsh
        run: |
          foreach ($file in 'PlancheContact.exe', 'PlancheContact.pri', 'engine\planche-contact-engine.exe') {
            if (-not (Test-Path "dist\planche-contact\$file")) { throw "missing in the built folder: $file" }
          }
          & dist\planche-contact\engine\planche-contact-engine.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $window = Start-Process -FilePath dist\planche-contact\PlancheContact.exe -PassThru
          Start-Sleep -Seconds 15
          if ($window.HasExited) { throw "the window stopped by itself (exit code $($window.ExitCode))" }
          Stop-Process -Id $window.Id
          $log = Join-Path $env:TEMP 'planche-contact-app.log'
          if (Test-Path $log) { Get-Content $log; throw "the window recorded an error" }

      # Only when a step above failed: the errors Windows itself recorded in
      # the last half hour. For a program that stopped by itself, they name
      # the faulty module and the error code.
      - name: Show the errors recorded by Windows
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Select-Object -First 12 |
            Format-List TimeCreated, ProviderName, Id, Message
          exit 0

      # Everything the installer will install, as a plain folder.
      - uses: actions/upload-artifact@v7
        with:
          name: planche-contact-folder
          path: dist/planche-contact
          if-no-files-found: error
