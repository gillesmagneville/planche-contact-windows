# SPDX-License-Identifier: GPL-3.0-only
#
# Builds and tests planche-contact-windows.
#
#   rust   (Linux)    tests the engine and the context menu handler, then
#                     cross-compiles both for Windows
#   app    (Windows)  tests the window's core library with that engine and
#                     the menu handler's COM code, builds the window, then
#                     checks the whole chain: menu handler -> window -> engine
#   installer (Linux) builds the NSIS installer from that folder; on a
#                     version tag, prepares a draft release with it

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  WINDOWS_TARGET: x86_64-pc-windows-gnu

jobs:
  rust:
    name: Engine (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the MinGW-w64 compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

      # The version pinned in rust-toolchain.toml, with the Windows target.
      - name: Install the Rust toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target "$WINDOWS_TARGET"
          rustup show active-toolchain
          cargo --version

      - name: Test
        run: cargo test --locked

      - name: Build for Windows
        run: cargo build --release --locked --target "$WINDOWS_TARGET"

      # They must run on a Windows that has no MinGW installed.
      - name: Check that the programs need no MinGW DLL
        run: |
          for program in planche-contact-engine planche-contact-verb; do
            if x86_64-w64-mingw32-objdump -p "target/$WINDOWS_TARGET/release/$program.exe" \
                | grep -i 'DLL Name' | grep -i -E 'libstdc\+\+|libgcc|libwinpthread'; then
              echo "::error::$program.exe depends on a MinGW DLL (see above)"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: engine-windows
          path: |
            target/${{ env.WINDOWS_TARGET }}/release/planche-contact-engine.exe
            target/${{ env.WINDOWS_TARGET }}/release/planche-contact-verb.exe
          if-no-files-found: error

  app:
    name: Window (C#, WinUI 3)
    needs: rust
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: engine-windows
          path: engine-windows

      # The same tests as on Linux, with the engine built for Windows.
      - name: Test the core library with the real engine
        shell: pwsh
        env:
          PLANCHE_CONTACT_REQUIRE_ENGINE: "1"
        run: |
          $env:PLANCHE_CONTACT_ENGINE = (Resolve-Path engine-windows\planche-contact-engine.exe).Path
          dotnet run -c Release --project app/PlancheContact.Core.Tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Its COM and shell code only exists in a Windows build.
      - name: Test the menu handler on Windows
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.*)"$').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --target $env:WINDOWS_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p planche-contact-verb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the window
        shell: pwsh
        run: |
          dotnet publish app/PlancheContact -c Release -r win-x64 -p:Platform=x64 -o dist/planche-contact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Add the engine and the menu handler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\planche-contact\engine | Out-Null
          Copy-Item engine-windows\planche-contact-engine.exe dist\planche-contact\engine\
          Copy-Item engine-windows\planche-contact-verb.exe dist\planche-contact\

      # On the real thing: the content of the folder, the window started
      # directly, then the whole chain menu handler -> window, as File
      # Explorer does (see shell-verb/examples/selftest.rs).
      - name: Check the built programs together
        shell: pwsh
        run: |
          & dist\planche-contact\engine\planche-contact-engine.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target\debug\examples\selftest.exe --dist dist\planche-contact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Only when a step above failed: the errors Windows itself recorded in
      # the last half hour. For a program that stopped by itself, they name
      # the faulty module and the error code.
      - name: Show the errors recorded by Windows
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2; StartTime = (Get-Date).AddMinutes(-30) } -ErrorAction SilentlyContinue |
            Select-Object -First 12 |
            Format-List TimeCreated, ProviderName, Id, Message
          exit 0

      # Everything the installer will install, as a plain folder.
      - uses: actions/upload-artifact@v7
        with:
          name: planche-contact-folder
          path: dist/planche-contact
          if-no-files-found: error

  installer:
    name: Installer
    needs: app
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to create the draft release, on a version tag only
    steps:
      - uses: actions/checkout@v7

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis binutils-mingw-w64-x86-64

      - uses: actions/download-artifact@v8
        with:
          name: planche-contact-folder
          path: dist/planche-contact

      - name: Build the installer
        run: bash ./build-installer.sh --dist dist/planche-contact

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: |
            dist/planche-contact-*-setup.exe
            dist/planche-contact-*-setup.exe.sha256
          if-no-files-found: error

      # A draft: nothing is public until you review and publish it yourself.
      - name: Prepare a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the VERSION file ($version)"
            exit 1
          fi
          bash ./tools/release-notes.sh "$version" > release-notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            dist/planche-contact-*-setup.exe \
            dist/planche-contact-*-setup.exe.sha256
