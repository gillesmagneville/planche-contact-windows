[package]
name = "planche-contact-verb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "File Explorer context-menu handler (out-of-process COM server) of planche-contact-windows"

[target.'cfg(windows)'.dependencies]
# Needed by name: the code generated by `#[implement]` refers to `::windows_core`.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
